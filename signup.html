<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EcoTrack AI</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">🌍 EcoTrack AI</a>
            <h2>Create Your Account</h2>
            <p class="auth-subtitle">Start your sustainability journey today.</p>

            <form id="signupForm">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                </div>

                <p class="error-message" id="errorMessage"></p>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
