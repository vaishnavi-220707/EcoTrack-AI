<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoTrack AI</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">🌍 EcoTrack AI</a>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to continue tracking your impact.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <p class="error-message" id="errorMessage"></p>

                <button type="submit" class="btn-primary">Log In</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
